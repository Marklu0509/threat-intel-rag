# Build the demo API image from the evaluated v0.1.0 data and measure it (grill-decisions Q49).
# Deployment to Azure is added in step 3.
name: API image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # push the image to GitHub Container Registry

jobs:
  build-and-measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the runner ships SDKs this build doesn't use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Download the evaluated passages and index, and verify SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0 --pattern demo-data-v0.1.0.tar.gz
          sha256sum --check deploy/demo-data.sha256
          mkdir -p data && tar -xzf demo-data-v0.1.0.tar.gz -C data

      - name: Build
        run: docker build -t threat-intel-api:ci .

      - name: Where the image size goes
        run: |
          {
            echo "## Image layers (largest first)"
            docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' threat-intel-api:ci \
              | sort -h -r | head -6 | cut -c1-140 | sed 's/^/    /'
            echo "## Inside the model cache"
            docker run --rm --entrypoint sh threat-intel-api:ci -c 'du -sh /opt/hf; find /opt/hf -type f -size +100M -exec du -h {} +' | sed 's/^/    /'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Measure at 1 vCPU / 2 GiB (the deployed size, Q52)
        run: bash deploy/measure.sh threat-intel-api:ci 2g 1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Push to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE=ghcr.io/marklu0509/threat-intel-api
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag threat-intel-api:ci "$IMAGE:${GITHUB_SHA::12}"
          docker push "$IMAGE:${GITHUB_SHA::12}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then docker tag threat-intel-api:ci "$IMAGE:latest" && docker push "$IMAGE:latest"; fi
          echo "- pushed \`$IMAGE:${GITHUB_SHA::12}\`" | tee -a "$GITHUB_STEP_SUMMARY"
