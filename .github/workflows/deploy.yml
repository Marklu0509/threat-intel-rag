# CI/CD for the demo API (grill-decisions Q49, Q51):
#   test -> build (from the evaluated v0.1.0 data, measured) -> deploy to Azure -> smoke test,
#   rolling back to the previous image if the smoke test fails.
# Pushes to main deploy. A manual run builds and measures; tick "deploy" to deploy it too.
name: Deploy API

on:
  push:
    branches: [main]
    paths: ["src/**", "Dockerfile", "pyproject.toml", "deploy/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy this build to Azure"
        type: boolean
        default: false

concurrency:
  group: deploy-api
  cancel-in-progress: false  # never interrupt a deploy halfway

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU-only torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1"
          pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to GitHub Container Registry
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Free disk space (the runner ships SDKs this build doesn't use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Download the evaluated passages and index, and verify SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0 --pattern demo-data-v0.1.0.tar.gz
          sha256sum --check deploy/demo-data.sha256
          mkdir -p data && tar -xzf demo-data-v0.1.0.tar.gz -C data

      - name: Build
        run: docker build --build-arg GIT_SHA=${{ steps.tag.outputs.tag }} -t threat-intel-api:ci .

      - name: Measure at the deployed size (1 vCPU / 2 GiB, Q52)
        run: bash deploy/measure.sh threat-intel-api:ci 2g 1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Push to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/marklu0509/threat-intel-api:${{ steps.tag.outputs.tag }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag threat-intel-api:ci "$IMAGE"
          docker push "$IMAGE"
          echo "- pushed \`$IMAGE\`" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || inputs.deploy
    runs-on: ubuntu-latest
    environment: production  # the Azure identity trusts only jobs in this environment
    permissions:
      contents: read
      id-token: write  # lets this job ask GitHub for a short-lived OIDC token
    env:
      APP: threat-intel-api-jpw
      RG: threat-intel-rag
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC (no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Remember the image now serving, for rollback
        id: current
        run: |
          echo "image=$(az containerapp show -n "$APP" -g "$RG" --query 'properties.template.containers[0].image' -o tsv)" >> "$GITHUB_OUTPUT"
          echo "url=https://$(az containerapp show -n "$APP" -g "$RG" --query 'properties.configuration.ingress.fqdn' -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Deploy the new image
        run: az containerapp update -n "$APP" -g "$RG" --image "ghcr.io/marklu0509/threat-intel-api:$TAG" -o none

      - name: Smoke test
        run: bash deploy/smoke.sh "${{ steps.current.outputs.url }}" "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Roll back to the previous image
        if: failure() && steps.current.outputs.image != ''
        run: |
          az containerapp update -n "$APP" -g "$RG" --image "${{ steps.current.outputs.image }}" -o none
          echo "- smoke test failed; rolled back to \`${{ steps.current.outputs.image }}\`" | tee -a "$GITHUB_STEP_SUMMARY"
