[project]
name = "attack-qa"
version = "0.1.0"
description = "Grounded question answering over MITRE ATT&CK with cited answers and explicit refusals"
requires-python = ">=3.12"
# Pinned to the versions the evaluation numbers were produced with
dependencies = [
    "anthropic==1.11.0",
    "chromadb==1.5.9",
    "google-genai==2.28.0",
    "openai==3.24.0",
    "rank-bm25==0.2.2",
    "sentence-transformers==6.1.0",
    "torch==2.14.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=attack_qa --cov-report=term-missing"
markers = [
    "integration: needs the downloaded ATT&CK file in data/raw",
]
